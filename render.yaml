services:
  - type: web
    name: rest-solar-ai
    runtime: docker
    plan: starter
    envVars:
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: LLM_MODEL
        value: gemini-3.1-flash-lite
      - key: LLM_API_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./data/rest_solar.db
      - key: ADMIN_SECRET_KEY
        generateValue: true
