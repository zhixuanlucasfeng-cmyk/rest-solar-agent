<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ t('admin_login_title') }}</title>
  <link rel="stylesheet" href="/static/admin.css">
</head>
<body><main class="login-page"><section class="login-record">
  <header><img src="/static/logo.svg" alt="Restar Solar"><span>{{ t('employee_operations') }}</span></header>
  <form action="/admin/language" method="post" class="login-language">
    <input type="hidden" name="next" value="{{ request.url.path }}">
    <label for="admin-language">{{ t('language') }}</label>
    <select id="admin-language" name="language" onchange="this.form.requestSubmit()">
      {% for code in supported_languages %}
      <option value="{{ code }}" {% if lang == code %}selected{% endif %}>{{ {'en': 'English', 'zh': '中文', 'fr': 'Français'}[code] }}</option>
      {% endfor %}
    </select>
    <noscript><button type="submit">{{ t('save') }}</button></noscript>
  </form>
  <div class="login-copy"><span class="page-kicker">{{ t('secure_access') }}</span><h1>{{ t('manage_local_market') }}</h1><p>{{ t('login_scope_description') }}</p></div>
  {% if error %}<div class="login-error" role="alert">{{ t(error) }}</div>{% endif %}
  <form action="/admin/login" method="post" class="login-form">
    <label>{{ t('email') }}<input type="email" name="email" placeholder="{{ t('email') }}" autocomplete="username" required></label>
    <label>{{ t('password') }}<input type="password" name="password" placeholder="{{ t('password') }}" autocomplete="current-password" required></label>
    <button type="submit" class="btn">{{ t('login') }}</button>
  </form>
</section></main></body></html>
