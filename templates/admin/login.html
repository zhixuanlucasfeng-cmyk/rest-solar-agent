<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sign in — Restar Solar Operations</title><link rel="stylesheet" href="/static/admin.css"></head>
<body><main class="login-page"><section class="login-record"><header><img src="/static/logo.svg" alt="Restar Solar"><span>EMPLOYEE OPERATIONS</span></header><div class="login-copy"><span class="page-kicker">Secure access</span><h1>Manage your local market.</h1><p>Products, stock, orders and customer conversations are restricted to the country assigned to your account.</p></div>{% if error %}<div class="login-error">{{ error }}</div>{% endif %}<form action="/admin/login" method="post" class="login-form"><label>Email<input type="email" name="email" autocomplete="username" required></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button type="submit" class="btn">Sign in</button></form></section></main></body></html>
