{% extends "admin/base.html" %}
{% block title %}Conversation #{{ conversation.id }}{% endblock %}
{% block content %}
<div class="flex justify-between items-center mb-6">
  <h1 class="text-2xl font-bold">Conversation #{{ conversation.id }}</h1>
  <button onclick="takeover({{ conversation.id }})"
          class="bg-orange-500 text-white px-4 py-2 rounded text-sm hover:bg-orange-600">
    Take Over
  </button>
</div>
<div class="bg-white rounded shadow p-4 space-y-3 max-w-2xl">
  {% for m in messages %}
  <div class="{% if m.role == 'user' %}text-right{% endif %}">
    <span class="inline-block px-3 py-2 rounded text-sm
      {% if m.role == 'user' %}bg-blue-100{% elif m.role == 'assistant' %}bg-gray-100{% else %}bg-yellow-50 text-xs{% endif %}">
      {% if m.role == 'tool' %}<em>Tool: {{ m.tool_name }}</em> — {% endif %}{{ m.content }}
    </span>
  </div>
  {% endfor %}
</div>
<script>
// Persistent admin WebSocket — opened once, handles incoming customer messages
let adminWs = null;
const protocol = location.protocol === 'https:' ? 'wss' : 'ws';

function connectAdminWs() {
  adminWs = new WebSocket(`${protocol}://${location.host}/ws/admin/{{ current_user.id }}`);

  adminWs.onmessage = (event) => {
    const data = JSON.parse(event.data);
    if (data.type === 'customer_message') {
      appendMessage('Customer', data.text, '#dbeafe');
    }
  };

  adminWs.onclose = () => {
    setTimeout(connectAdminWs, 3000);
  };
}

function appendMessage(role, text, bg) {
  const msgs = document.querySelector('.space-y-3') || document.querySelector('[class*="space"]');
  if (!msgs) return;
  const div = document.createElement('div');
  div.style.cssText = `background:${bg};padding:8px 12px;border-radius:8px;margin:4px 0;`;
  div.textContent = `[LIVE] ${role}: ${text}`;
  msgs.appendChild(div);
  div.scrollIntoView();
}

function takeover(convId) {
  if (!adminWs || adminWs.readyState !== WebSocket.OPEN) {
    alert('Not connected to admin channel. Please wait and retry.');
    return;
  }
  adminWs.send(JSON.stringify({action: 'takeover', conversation_id: convId}));
  document.querySelector('button[onclick]').textContent = 'Taking over...';
}

// Connect on page load
connectAdminWs();
</script>
{% endblock %}
