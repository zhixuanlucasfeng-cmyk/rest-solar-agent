{% extends "admin/base.html" %}
{% block title %}{{ t('dashboard') }}{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-6">{{ t('dashboard') }}</h1>
<div class="grid grid-cols-2 gap-4 max-w-lg">
  <div class="bg-white rounded shadow p-6 text-center">
    <div class="text-4xl font-bold text-blue-800">{{ conv_count }}</div>
    <div class="text-gray-500 mt-1 text-sm">{{ t('total_conversations') }}</div>
  </div>
  <div class="bg-white rounded shadow p-6 text-center">
    <div class="text-4xl font-bold text-orange-500">{{ open_tickets }}</div>
    <div class="text-gray-500 mt-1 text-sm">{{ t('open_tickets') }}</div>
  </div>
</div>
{% endblock %}
