{% extends "admin/base.html" %}
{% block title %}{{ t('reports') }}{% endblock %}
{% block page_header %}<div class="page-head"><div><span class="page-kicker">{{ t('records') }}</span><h1>{{ t('reports') }}</h1><p>{{ t('reports_description') }}</p></div></div>{% endblock %}
{% block content %}
<div class="panel p-6 max-w-md">
  <h2 class="font-semibold mb-2">{{ t('export_conversations') }}</h2>
  <p class="text-sm text-gray-500 mb-4">{{ t('export_description') }}</p>
  <form action="/admin/reports/export" method="post">
    <button type="submit" class="bg-blue-800 text-white px-4 py-2 rounded text-sm">{{ t('trigger_export') }}</button>
  </form>
</div>
{% endblock %}
